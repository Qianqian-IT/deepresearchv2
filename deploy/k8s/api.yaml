# =============================================================================
# API：无状态多副本 + HPA + Service
#   应用前先创建密钥：
#     kubectl create secret generic dr-secrets \
#       --from-literal=JWT_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#       --from-literal=BYOK_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')" \
#       --from-literal=DATABASE_URL="postgresql+asyncpg://dr:pass@pg:5432/deepresearch" \
#       --from-literal=REDIS_URL="redis://redis:6379/0"
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-api
  labels: { app: dr-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dr-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # 滚动升级不中断
  template:
    metadata:
      labels: { app: dr-api }
    spec:
      containers:
        - name: api
          image: dr-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: prod
            - name: SERVE_WEB
              value: "1"
          envFrom:
            - secretRef: { name: dr-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dr-api
spec:
  selector: { app: dr-api }
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dr-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dr-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
