# =============================================================================
# 一键起本地全栈：postgres + redis + api + worker (+ minio 可选)
#
#   cd deploy && docker compose up -d --build
#   扩副本：docker compose up -d --scale api=2 --scale worker=4
#
# 生产密钥请勿写在这里，用 .env（已在 .gitignore 忽略）或 K8s Secret 注入。
# =============================================================================

name: deepresearch

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://dr:${POSTGRES_PASSWORD:-dr}@postgres:5432/deepresearch
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 .env 中设置 JWT_SECRET_KEY}
  BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  MAX_CONCURRENT_TASKS_PER_TENANT: ${MAX_CONCURRENT_TASKS_PER_TENANT:-3}
  MAX_TASKS_PER_DAY_PER_TENANT: ${MAX_TASKS_PER_DAY_PER_TENANT:-200}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-db}
  RESEARCH_TASK_TIMEOUT_SECONDS: ${RESEARCH_TASK_TIMEOUT_SECONDS:-1800}
  SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dr}
      POSTGRES_DB: deepresearch
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr -d deepresearch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    profiles: ["s3"]        # 只有 STORAGE_BACKEND=s3 时才需要：docker compose --profile s3 up -d
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      <<: *app-env
      SERVE_WEB: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

volumes:
  pgdata:
  redisdata:
  miniodata:
